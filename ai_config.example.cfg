; ============================================================
; AI 模型配置示例
; 将本文件复制为 ai_config.cfg 后，填入你自己的 key。
; 公开仓库中只提交这个示例文件，不提交真实 ai_config.cfg。
; 默认思考模式在 AIService 中关闭。
; ============================================================

[profiles/deepseek_chat]
type="chat"
base_url="https://api.deepseek.com"
api_key="YOUR_API_KEY_HERE"
model="deepseek-v4-flash"
thinking="disabled"
enable_thinking=false
reasoning_effort=""

[profiles/deepseek_v4_pro]
type="chat"
base_url="https://api.deepseek.com"
api_key="YOUR_API_KEY_HERE"
model="deepseek-v4-pro"
thinking="disabled"
enable_thinking=false
reasoning_effort=""

[profiles/deepseek_pro]
type="chat"
base_url="https://api.deepseek.com"
api_key="YOUR_API_KEY_HERE"
model="deepseek-v4-pro"
thinking="disabled"
enable_thinking=false
reasoning_effort=""

; ============================================================
; Role -> Profile 映射
; ============================================================
[roles]
chat_default="deepseek_chat"
linkchat="deepseek_chat"
input_guard="deepseek_chat"
memory_summarizer="deepseek_chat"
file_viewer="deepseek_chat"
browser="deepseek_chat"
dev_planner="deepseek_chat"

; --- 浏览器表单与生成 ---
signup_review="deepseek_chat"
creative_brief_outline="deepseek_chat"
date_event="deepseek_chat"
sbeam_catalog_generator="deepseek_chat"
shop_generator="deepseek_chat"

; --- AVG Dev AI Agent ---
avg_dev_main="deepseek_chat"
avg_dev_writer="deepseek_chat"
avg_dev_executor="deepseek_chat"

; --- 内容生成与修复 ---
date_scene_writer="deepseek_chat"
dsl_repair="deepseek_chat"
part_time_generator="deepseek_chat"
minigame="deepseek_chat"
creative_decision="deepseek_chat"
date_scene_reviewer="deepseek_chat"
work_order="deepseek_chat"
work_order_controller="deepseek_chat"
work_order_planner="deepseek_chat"
work_order_writer="deepseek_chat"
work_order_executor="deepseek_chat"

; 某个 role 需要覆盖 profile 的思考设置时，添加 role_settings/<role_name>。
; 当前 date_scene_writer 开启思考模式。
[role_settings/date_scene_writer]
thinking="enabled"
enable_thinking=true
reasoning_effort="high"

[dev]
disable_background_llm=false
quiet_debug_logs=false
