; ============================================================
; AI 模型配置示例
; 将本文件复制为 ai_config.cfg 后，填入你自己的 key。
; 公开仓库中只提交这个示例文件，不提交真实 ai_config.cfg。
; ============================================================

; --- 火山引擎 Chat 模型 ---

[profiles/doubao-mini]
type="chat"
base_url="https://ark.cn-beijing.volces.com/api"
api_key="YOUR_API_KEY_HERE"
model="doubao-seed-2-0-mini-260215"

[profiles/doubao-lite]
type="chat"
base_url="https://ark.cn-beijing.volces.com/api"
api_key="YOUR_API_KEY_HERE"
model="doubao-seed-2-0-lite-260215"

[profiles/doubao-pro]
type="chat"
base_url="https://ark.cn-beijing.volces.com/api"
api_key="YOUR_API_KEY_HERE"
model="doubao-seed-2-0-pro-260215"

[profiles/deepseek-v3]
type="chat"
base_url="https://ark.cn-beijing.volces.com/api"
api_key="YOUR_API_KEY_HERE"
model="deepseek-v3-2-251201"

; --- 火山引擎 Image 模型 ---

[profiles/volcengine_art]
type="image"
base_url="https://ark.cn-beijing.volces.com/api/v3"
api_key="YOUR_API_KEY_HERE"
model="doubao-seedream-4-5-251128"

; --- 外部模型（备用） ---

[profiles/deepseek_chat]
type="chat"
base_url="https://api.deepseek.com"
api_key="YOUR_API_KEY_HERE"
model="deepseek-chat"

[profiles/gemini_flash]
type="chat"
base_url="https://generativelanguage.googleapis.com/v1beta/openai"
api_key="YOUR_API_KEY_HERE"
model="gemini-3-flash-preview"

; ============================================================
; Role -> Profile 映射
; ============================================================
[roles]
chat_default="doubao-lite"
linkchat="doubao-lite"
file_viewer="doubao-mini"
art_ai="volcengine_art"
browser="doubao-pro"
avg_dev_main="doubao-lite"
avg_dev_writer="deepseek-v3"
avg_dev_executor="doubao-mini"
date_scene_writer="deepseek-chat"
dsl_repair="doubao-mini"
date_event="deepseek-v3"
part_time_generator="deepseek-chat"
date_scene_reviewer="doubao-mini"
work_order="doubao-lite"

[dev]
disable_background_llm=false
quiet_debug_logs=false
