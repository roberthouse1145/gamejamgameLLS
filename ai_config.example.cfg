; ============================================================
; AI 模型配置示例
; 将本文件复制为 ai_config.cfg 后，填入你自己的 key。
; 公开仓库中只提交这个示例文件，不提交真实 ai_config.cfg。
; 默认思考模式在 AIService 中关闭。
; ============================================================

[profiles/deepseek_chat]
type="chat"
base_url="https://api.deepseek.com"
api_key="YOUR_API_KEY_HERE"
model="deepseek-v4-flash"
thinking="enabled"
enable_thinking=true
reasoning_effort="low"

; ============================================================
; Role -> Profile 映射
; ============================================================
[roles]
chat_default="deepseek_chat"

; --- 内容生成与修复 ---
avg_scene_writer="deepseek_chat"
dsl_repair="deepseek_chat"
outing_post_writer="deepseek_chat"

; 某个 role 需要覆盖 profile 的思考设置时，添加 role_settings/<role_name>。
; 动态 AVG 写作默认直接成稿；语法质量由验证与局部 repair 兜底。
[role_settings/avg_scene_writer]
thinking="disabled"
enable_thinking=false

; Repair 面向验证器给出的具体错误，直接执行局部修改。
[role_settings/dsl_repair]
thinking="disabled"
enable_thinking=false

[role_settings/outing_post_writer]
thinking="disabled"
enable_thinking=false
